services:
  db:
    image: postgres:17
    container_name: tasks_db

    env_file:
      - .env

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .

    container_name: tasks_app

    env_file:
      - .env

    environment:
      REDIS_URL: redis://redis:6379/0
      INNGEST_DEV: "1"
      INNGEST_BASE_URL: "http://host.docker.internal:8288"

    ports:
      - "8000:8000"
      - "8001:8001"

    depends_on:
      - db
      - redis

  redis:
    image: redis:7-alpine
    container_name: tasks_redis

    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]

    volumes:
      - redis_data:/data

  outbox_worker:
    build: .
    container_name: tasks_outbox_worker

    command: ["python", "-m", "jobs_api.worker"]

    env_file:
      - .env

    environment:
      REDIS_URL: redis://redis:6379/0
      INNGEST_DEV: "1"
      INNGEST_BASE_URL: "http://host.docker.internal:8288"

    depends_on:
      - db
      - redis

    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
